[project]
name = "nldate"
version = "0.1.0"
description = "Parse natural-language date expressions into datetime.date objects"
readme = "README.md"
authors = [
    { name = "t6chow", email = "166340075+t6chow@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
nldate = "nldate:main"

[build-system]
requires = ["uv_build>=0.8.16,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
